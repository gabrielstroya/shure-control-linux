[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "shure-control-linux"
version = "0.2.1"
description = "Independent original Shure MV7 controller and PipeWire WebRTC AEC for Ubuntu"
requires-python = ">=3.11"
license = "GPL-3.0-only"
readme = "README.md"
license-files = ["LICENSE", "COPYRIGHT", "THIRD_PARTY_NOTICES.md"]

[project.scripts]
shure-control-linux = "app.main:main"

[tool.setuptools.packages.find]
include = ["app*"]
